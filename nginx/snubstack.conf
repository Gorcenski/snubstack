# Host-side nginx config — install to /etc/nginx/sites-available/ and symlink.
# Ozone (the labeler service) binds to 127.0.0.1:7401 in docker-compose.prod.yml
# and serves both com.atproto.label.* (public) and tools.ozone.* (admin) on the
# same xrpc surface.

server {
    listen 80;
    server_name labeler.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name labeler.example.com;

    ssl_certificate     /etc/letsencrypt/live/labeler.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/labeler.example.com/privkey.pem;

    # ATProto labeler + Ozone xrpc.
    location /xrpc/ {
        proxy_pass http://127.0.0.1:7401;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for subscribeLabels.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        return 404;
    }
}
