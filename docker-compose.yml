services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snubstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snubstack}
      POSTGRES_DB: ${POSTGRES_DB:-snubstack}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snubstack}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ozone-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ozone
      POSTGRES_PASSWORD: ${OZONE_DB_PASSWORD:-ozone}
      POSTGRES_DB: ozone
    volumes:
      - ozonedata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ozone"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ozone:
    image: ghcr.io/bluesky-social/ozone:latest
    environment:
      OZONE_SERVER_DID: ${LABELER_DID}
      OZONE_PUBLIC_URL: ${OZONE_PUBLIC_URL:-http://localhost:3000}
      OZONE_ADMIN_DIDS: ${OZONE_ADMIN_DIDS}
      OZONE_ADMIN_PASSWORD: ${OZONE_ADMIN_PASSWORD}
      OZONE_SIGNING_KEY_HEX: ${OZONE_SIGNING_KEY_HEX}
      OZONE_DB_POSTGRES_URL: postgresql://ozone:${OZONE_DB_PASSWORD:-ozone}@ozone-db:5432/ozone
      OZONE_DID_PLC_URL: https://plc.directory
      OZONE_APPVIEW_URL: https://api.bsky.app
      OZONE_APPVIEW_DID: did:web:api.bsky.app
      OZONE_PDS_URL: https://bsky.social
      OZONE_PDS_DID: did:web:bsky.social
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      ozone-db:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  consumer:
    build: .
    command: python -m snubstack.consumer.main
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: python -m snubstack.worker.main
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      ozone:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  ozonedata:
