services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: snubstack
      POSTGRES_USER: snubstack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snubstack"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ozone-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ozone
      POSTGRES_USER: ozone
      POSTGRES_PASSWORD: ${OZONE_DB_PASSWORD}
    volumes:
      - ozonedata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ozone"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ozone:
    image: ghcr.io/bluesky-social/ozone:latest
    restart: unless-stopped
    environment:
      OZONE_SERVER_DID: ${LABELER_DID}
      OZONE_PUBLIC_URL: ${OZONE_PUBLIC_URL}
      OZONE_ADMIN_DIDS: ${OZONE_ADMIN_DIDS}
      OZONE_ADMIN_PASSWORD: ${OZONE_ADMIN_PASSWORD}
      OZONE_SIGNING_KEY_HEX: ${OZONE_SIGNING_KEY_HEX}
      OZONE_DB_POSTGRES_URL: postgresql://ozone:${OZONE_DB_PASSWORD}@ozone-db:5432/ozone
      OZONE_DB_MIGRATE: "1"
      OZONE_DID_PLC_URL: https://plc.directory
      OZONE_APPVIEW_URL: https://api.bsky.app
      OZONE_APPVIEW_DID: did:web:api.bsky.app
      OZONE_PDS_URL: https://bsky.social
      OZONE_PDS_DID: did:web:bsky.social
    ports:
      - "127.0.0.1:7401:3000"
    depends_on:
      ozone-db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  migrate:
    image: ${SNUBSTACK_IMAGE}
    command: alembic upgrade head
    restart: "no"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  consumer:
    image: ${SNUBSTACK_IMAGE}
    command: python -m snubstack.consumer.main
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    image: ${SNUBSTACK_IMAGE}
    command: python -m snubstack.worker.main
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      ozone:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
  ozonedata:
